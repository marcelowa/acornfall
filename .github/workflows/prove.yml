name: prove

# The release's proof job takes ~35 minutes: build the appliance, publish a release, then boot
# it. That is right for a release and wrong for everything else — three failures in a row were
# in the test harness, and each cost half an hour to learn about. This is the same boot, on a
# branch push, from the appliance the release already built: a few minutes, nothing published.

on:
  workflow_dispatch:
  push:
    branches: [feat/one-vm-per-machine]
    paths:
      - "gateway/**"
      - "worker/src/**"
      - "scripts/build-appliance.sh"
      - ".github/workflows/prove.yml"

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    # A machine inside a machine, so the runner needs /dev/kvm — the same label the sandbox tier uses.
    runs-on: kvm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: gateway/go.sum
      # The same key the release uses: if the appliance changed, this is a miss and the proof is
      # skipped with a reason rather than a red mark. The release builds it on the next tag.
      - uses: actions/cache@v4
        id: appliance
        with:
          path: dist/appliance-linux-amd64.tar.gz
          key: appliance-${{ hashFiles('gateway/**', 'worker/src/**', 'worker/package.json', 'worker/bun.lock', 'scripts/build-appliance.sh') }}
      - name: Say why it cannot run
        if: steps.appliance.outputs.cache-hit != 'true'
        run: |
          echo "::warning::no cached appliance for these inputs; the next tag builds and proves it"
      - name: Unpack the release's tarball and boot it
        if: steps.appliance.outputs.cache-hit == 'true'
        env:
          ACORNFALL_LXC: "1"
          MSB_HOME: /tmp/msb-prove
          TMPDIR: /tmp
          ACORNFALL_APPLIANCE_TARBALL: dist/appliance-linux-amd64.tar.gz
        # The module is in gateway/, not at the root: go test from the root cannot find it.
        working-directory: gateway
        run: go test ./internal/sandbox -run TestLiveTheApplianceBootsFromItsReleaseTarball -v -timeout 25m
